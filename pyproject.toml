[project]
name = "geovision"
version = "0.1.0"
description = "Agent-driven 2D and 3D geometry viewer"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MonsoonDev", email = "nixenome@gmail.com" }]
dependencies = []
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Topic :: Multimedia :: Graphics :: Viewers",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/MonsoonDev/geovision"
Repository = "https://github.com/MonsoonDev/geovision"
Issues = "https://github.com/MonsoonDev/geovision/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]
desktop = ["mcp>=2.2"]

[project.scripts]
geovision = "geovision.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geovision = ["viewer/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
