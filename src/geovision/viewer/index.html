<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GeoVision</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <header>
      <div class="brand">GeoVision</div>
      <h1 id="title">Untitled</h1>
      <button type="button" id="edit-toggle" class="edit-toggle" aria-pressed="false">Edit</button>
      <div class="mode-switch" role="group" aria-label="View mode">
        <button type="button" id="mode-2d" aria-pressed="true">2D</button>
        <button type="button" id="mode-3d" aria-pressed="false">3D</button>
      </div>
    </header>
    <div class="layout">
      <main id="stage">
        <svg id="view2d" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="view3d" hidden></div>
        <div id="tools" class="tools" hidden>
          <div id="tool-row" class="tool-row"></div>
          <form id="graph-form" class="graph-form">
            <label>y = <input id="graph-expr" type="text" placeholder="x^2" autocomplete="off" /></label>
            <input id="graph-min" type="text" value="-5" aria-label="domain start" />
            <span>to</span>
            <input id="graph-max" type="text" value="5" aria-label="domain end" />
            <button type="submit">Plot</button>
          </form>
          <p id="graph-note" class="graph-note" hidden>Graphs are only in the 2D view.</p>
        </div>
        <div id="camera-dock" class="camera-dock">
          <svg id="gizmo" class="gizmo" viewBox="0 0 96 96" role="img" aria-label="Camera axes"></svg>
          <div class="camera-zoom">
            <button type="button" id="cam-in" aria-label="Zoom in">+</button>
            <button type="button" id="cam-home" aria-label="Reset camera">
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.4" />
                <circle cx="8" cy="8" r="1.6" fill="currentColor" />
              </svg>
            </button>
            <button type="button" id="cam-out" aria-label="Zoom out">−</button>
          </div>
        </div>
        <p id="hint"></p>
        <p id="cam-lock" hidden>Camera is locked while editing</p>
      </main>
      <aside>
        <div id="stepbox" class="stepbox" hidden>
          <label id="step-label" for="step">Step</label>
          <input id="step" type="range" min="0" max="0" value="0" />
        </div>
        <h2>Objects</h2>
        <ul id="list"></ul>
      </aside>
    </div>
    <script type="module" src="/viewer.js"></script>
  </body>
</html>
